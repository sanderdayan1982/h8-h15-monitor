# Netlify configuration — FRED API proxy
# Routes /fred-proxy/* through a serverless function that resolves CORS
# AND injects the api_key server-side (from env var FRED_API_KEY).
# The key never appears in the repo or in the client.
[[redirects]]
  from = "/fred-proxy/*"
  to   = "/.netlify/functions/fred-proxy/:splat"
  status = 200
  force  = true
